[package]
name = "bitrixtext_forge"
version = "0.1.1"
edition = "2024"
description = "Markdown to Bitrix24 BBCode converter with egui GUI"

[profile.release]
opt-level = 3
lto = "thin"

[[bin]]
name = "bitrixtext_forge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = "3"
directories = "6"
egui = "0.36"
fontdb = "0.24"
pulldown-cmark = "0.13"
rfd = "0.17"
rust_xlsxwriter = "0.99"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
] }

[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
    "wgpu",
    "x11",
    "wayland",
] }

[build-dependencies]
vergen-gitcl = { version = "10", features = ["build"] }
