[package]
name = "bitrixtext_forge"
version = "0.1.0"
edition = "2024"
description = "Markdown to Bitrix24 BBCode converter with egui GUI"

[profile.release]
opt-level = 3
lto = "thin"

[[bin]]
name = "bitrixtext_forge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = "3"
directories = "6"
eframe = "0.36"
egui = "0.36"
fontdb = "0.24"
pulldown-cmark = "0.13"
rfd = "0.17"
rust_xlsxwriter = "0.99"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
vergen-gitcl = { version = "10", features = ["build"] }
